name: Test

on:
  pull_request:
    paths:
      - 'relay/**'
  push:
    branches: [main]
    paths:
      - 'relay/**'

jobs:
  test:
    name: Relay Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: relay

      - name: Run tests
        run: npm test
        working-directory: relay
