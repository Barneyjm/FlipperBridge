name = "flipper-bridge"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "SESSIONS"
id = "<your-kv-namespace-id>"
preview_id = "<your-preview-kv-namespace-id>"

[dev]
port = 8787

# Rate limiting via binding (optional, can also be done in-code)
# For free tier, we implement rate limiting via KV
